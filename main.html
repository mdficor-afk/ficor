<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피코밴드 | 전문의 처방 파인더</title>
<link rel="stylesheet" type="text/css" href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css'>
<style>
  :root{
    --navy-dark:#0D2D4F;
    --navy-mid:#043B72;
    --orange:#FF6600;
    --tint-a:#EAF1F8;
    --tint-b:#E4EEF6;
    --tint-c:#FFF1E4;
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:Pretendard,-apple-system,sans-serif; }
  ul li{ list-style-type:none; }
  a{ text-decoration:none; color:inherit; }

  #quizMain{
    padding:6.2% 0 0;
    text-align:center;
    background:linear-gradient(180deg, #CFE0EE 0%, #F3F7FB 46%);
  }

  .lead-top{ padding-top:4px; color:var(--navy-mid); font-size:13.5px; font-weight:700; }

  .intro{ padding:0 24px; }
  .intro h1{
    margin-bottom:14px; color:var(--navy-dark);
    font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.4;
  }
  .intro p{
    color:#3C5670; font-size:16px; font-weight:400;
    line-height:1.7; letter-spacing:-0.01em;
  }

  /* 히어로 일러스트 영역 */
  .character{ max-width:230px; margin:14px auto -24px; position:relative; z-index:9; }
  .character .char-img{ width:100%; height:auto; display:block; filter:drop-shadow(0 16px 20px rgba(13,45,79,0.16)); }

  .contentsBox{
    position:relative; padding:4.6% 0 5.8%;
    overflow:hidden; z-index:5;
  }
  .contentsBox::before{
    content:""; position:absolute; left:50%; top:0;
    width:2300px; height:650px;
    border-top-left-radius:50%; border-top-right-radius:50%;
    background:#FFF; z-index:-1; transform:translateX(-50%);
  }

  .cardBox{ margin:40px 0 30px; }
  .cardBox ul{ display:flex; justify-content:center; gap:14px; line-height:1; padding:0 20px; }
  .cardBox ul li{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width:150px; padding:24px 16px; border-radius:16px;
    background:var(--tint-a);
  }
  .cardBox ul li span{ font-size:32px; }
  .cardBox ul li img{ width:40px; height:40px; object-fit:contain; }
  .cardBox ul li p{ color:var(--navy-dark); font-size:14px; font-weight:700; }
  .cardBox ul li small{ color:#7488A0; font-size:11.5px; font-weight:500; }

  .quizeBtn{
    display:inline-flex; justify-content:center; align-items:center; gap:8px;
    border-radius:14px; background:var(--navy-dark);
    box-shadow:0 6px 14px rgba(13,45,79,0.16);
    transition:transform .12s ease;
  }
  .quizeBtn:active{ transform:scale(0.98); }
  .quizeBtn a{ padding:18px 52px; color:#fff; font-size:18px; font-weight:800; letter-spacing:-0.01em; }
  .quizeBtn a span{ padding-left:8px; font-weight:600; }

  .subnote{ margin-top:16px; color:#8496AA; font-size:12.5px; }

  @media (max-width:520px){
    #quizMain{ padding:14% 0 0; }
    .character{ max-width:170px; margin:10px auto -16px; }
    .intro h1{ font-size:21px; }
    .intro p{ font-size:14px; }
    .cardBox{ margin:34px 0 24px; }
    .cardBox ul{ gap:6px; padding:0 18px; }
    .cardBox ul li{ width:100%; padding:18px 6px; border-radius:12px; gap:10px; }
    .cardBox ul li span{ font-size:24px; }
    .cardBox ul li img{ width:30px; height:30px; }
    .cardBox ul li p{ font-size:12px; }
    .cardBox ul li small{ font-size:10px; }
    .quizeBtn a{ padding:15px 38px; font-size:15.5px; }
  }
</style>
</head>
<body>
