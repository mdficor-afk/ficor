<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FICOR AI 처방 파인더</title>
<link rel="stylesheet" type="text/css" href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css'>
<style>
:root{
  --navy-dark:#0D2D4F;
  --navy-mid:#043B72;
  --orange:#FF6600;

  --bg:#FFFFFF;
  --card:#ffffff;
  --tint:#EDF3F8;

  --text:#16283A;
  --sub:#5C7086;
  --muted:#94A6B8;

  --accent-bg:#EAF1F8;
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}
button,a{ font-family:inherit; }

.wrap{ width:100%; max-width:600px; margin:0 auto; padding:38px 18px 70px; }

/* ---------- 상단 소개 ---------- */
.hero .brand{ font-size:14px; font-weight:800; color:var(--navy-dark); }
.hero .brand span{ font-weight:500; color:var(--navy-mid); margin-left:4px; }
.hero h1{ margin:16px 0 8px; font-size:26px; line-height:1.4; color:var(--navy-dark); }
.hero p{ margin:0; color:var(--sub); font-size:14px; line-height:1.7; }

/* ---------- 진행률 ---------- */
.progress{ display:flex; align-items:center; gap:12px; margin:28px 0 22px; }
.track{ flex:1; height:5px; overflow:hidden; border-radius:5px; background:var(--tint); }
.fill{ height:100%; width:0%; background:var(--orange); transition:width .3s ease; }
.count{ color:var(--muted); font-size:12px; white-space:nowrap; }

/* ---------- 질문 & 선택지 ---------- */
.qkey{ color:var(--orange); font-size:12.5px; font-weight:700; }
.qtext{ margin:6px 0 18px; font-size:20px; font-weight:800; line-height:1.5; color:var(--navy-dark); }

.opts{ display:flex; flex-wrap:wrap; gap:9px; }
.opt{
  display:flex; align-items:center; gap:13px;
  width:calc(50% - 5px); padding:15px 14px;
  border-radius:14px; background:var(--tint);
  cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .1s ease;
}
.opt:active{ transform:scale(0.99); }
.opt.sel{ background:var(--navy-dark); }
.opt.sel .opt-label{ color:#fff; }
.opt.sel .opt-sub{ color:#AFC4D8; }
.opt.sel .ico{ background:var(--orange); }
.ico{
  display:flex; align-items:center; justify-content:center;
  width:44px; height:44px; flex-shrink:0; border-radius:11px;
  background:#fff; font-size:22px; overflow:hidden;
}
.ico img{ width:100%; height:100%; object-fit:cover; }
.opt-label{ font-size:14px; font-weight:700; line-height:1.4; text-align:left; color:var(--text); }
.opt-sub{ display:block; margin-top:2px; font-size:11.5px; font-weight:500; color:var(--muted); }

/* ---------- 이동 버튼 ---------- */
.nav{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
.btn{
  height:46px; padding:0 6px; background:transparent;
  font-weight:700; cursor:pointer; color:var(--sub); border:none; font-size:14px;
}
.btn.primary{
  padding:0 26px; border-radius:11px; background:var(--orange); color:#fff;
}
.btn:disabled{ opacity:.35; cursor:default; }

/* ---------- 로딩 ---------- */
.loading{ display:none; }
.loading.on{ display:flex; align-items:center; flex-direction:column; padding:80px 10px; }
.spin{
  width:36px; height:36px; border:3px solid var(--tint); border-top-color:var(--orange);
  border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading p{ margin-top:16px; color:var(--sub); font-size:13.5px; }

/* ---------- 결과 ---------- */
.result{ display:none; }
.result.on{ display:block; }

.analysis{ margin:18px 0; padding:18px 20px; border-radius:14px; background:var(--accent-bg); }
.analysis h3{ margin:0 0 10px; color:var(--navy-dark); font-size:14px; }
.analysis p{ margin:5px 0; color:#2E4A63; font-size:13.5px; line-height:1.7; }

.card{
  padding:0; border-radius:20px; background:#fff; overflow:hidden;
  box-shadow:0 16px 36px rgba(13,45,79,0.14);
}
.card-photo{ width:100%; aspect-ratio:1/1; overflow:hidden; background:#F3F3F3; }
.card-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.card-top{ background:var(--navy-dark); padding:20px 26px; }
.card-top .kicker{ color:var(--orange); font-size:12px; font-weight:800; }
.card-top .pname{ margin:8px 0 4px; font-size:21px; font-weight:800; color:#fff; }
.card-top .pprice{ color:#AFC4D8; font-size:14px; font-weight:600; }
.card-body{ padding:22px 26px 26px; }
.summary{ color:var(--sub); font-size:14px; line-height:1.8; }

.sect{ margin-top:20px; }
.sect h3{ margin:0 0 10px; font-size:14.5px; color:var(--navy-dark); }
.why{ margin:0; padding-left:20px; color:var(--sub); font-size:13.5px; line-height:1.8; }

.buy{
  display:flex; align-items:center; justify-content:center; height:50px; margin-top:22px;
  border-radius:11px; background:var(--orange); color:#fff; font-weight:800; text-decoration:none;
}
.buy span{ margin-left:6px; }

.alts{ margin-top:22px; }
.alts h3{ margin:0 0 8px; font-size:14.5px; color:var(--navy-dark); }
.alts-note{ margin:0 0 10px; color:var(--sub); font-size:12.5px; line-height:1.7; }
.alt{
  display:flex; align-items:center; gap:14px; margin-top:8px; padding:13px 14px;
  border-radius:13px; background:var(--tint); text-decoration:none; color:var(--text);
}
.alt .ico{ width:48px; height:48px; font-size:24px; background:#fff; }
.alt-name{ font-size:14px; font-weight:700; }
.alt-desc{ color:var(--sub); font-size:12px; margin-top:3px; line-height:1.5; }
.alt-arrow{ margin-left:auto; color:var(--muted); font-size:18px; }

.restart{
  width:100%; height:46px; margin-top:24px; background:transparent;
  color:var(--sub); cursor:pointer; font-weight:600; border:none; font-size:13.5px;
}

.disclaim{ margin-top:14px; color:var(--muted); font-size:11.5px; line-height:1.6; text-align:center; }

@media (max-width:480px){
  .wrap{ padding-top:26px; }
  .hero h1{ font-size:22px; }
  .qtext{ font-size:17px; }
  .card-top .pname{ font-size:19px; }
}
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="brand">FICOR<span>피코밴드 AI 처방 파인더</span></div>
    <h1>나에게 꼭 맞는<br>보호대를 처방해드릴게요</h1>
    <p>몇 가지 답변을 바탕으로 통증 부위와 생활 패턴을 분석해 가장 적합한 피코밴드 제품을 추천해드려요.</p>
  </header>

  <section id="load" class="loading on">
    <div class="spin"></div>
    <p>맞춤 처방을 준비하는 중...</p>
  </section>

  <section id="quiz" style="display:none">
    <div class="progress">
      <div class="track"><div id="fill" class="fill"></div></div>
      <span id="count" class="count"></span>
    </div>
    <div id="step"></div>
    <div class="nav">
      <button id="prev" class="btn" type="button">← 이전</button>
      <button id="next" class="btn primary" type="button" disabled>다음 →</button>
    </div>
  </section>

  <section id="result" class="result"></section>

</main>

    desc: "움직임은 편하게 두면서 무릎 관절은 안정적으로 잡아주는 보호대예요. 등산·계단처럼 무릎에 부담이 큰 활동 전후에 착용하기 좋아요.",
  },
};

/* =========================================================
   2. 상태값
   ========================================================= */
let currentStep = 0;
let answers = {};
const $ = (sel) => document.querySelector(sel);

/* =========================================================
   3. 초기화 (로딩 → 설문 시작)
   ========================================================= */
function initialize(){
  setTimeout(() => {
    $("#load").classList.remove("on");
    $("#quiz").style.display = "block";
    renderQuestion();
  }, 550);
}

/* =========================================================
   4. 질문 렌더링
   ========================================================= */
function renderQuestion(){
  const total = QUESTIONS.length;
  const q = QUESTIONS[currentStep];
  const progressPct = Math.round((currentStep / total) * 100);

  $("#fill").style.width = progressPct + "%";
  $("#count").textContent = (currentStep + 1) + " / " + total;

  const selected = answers[q.key];

  $("#step").innerHTML = `
    <div class="qkey">${q.qkey}</div>
    <div class="qtext">${q.text}</div>
    <div class="opts">
      ${q.options.map(o => `
        <div class="opt ${selected === o.id ? "sel" : ""}" data-value="${o.id}">
          <div class="ico">${o.icon}</div>
          <div class="opt-label">${o.label}${o.sub ? `<span class="opt-sub">${o.sub}</span>` : ""}</div>
        </div>
      `).join("")}
    </div>
  `;

  document.querySelectorAll(".opt").forEach(el => {
    el.addEventListener("click", () => {
      answers[q.key] = el.dataset.value;
      renderQuestion();
    });
  });

  $("#prev").disabled = currentStep === 0;
  $("#next").disabled = !answers[q.key];
  $("#next").textContent = currentStep === total - 1 ? "결과 보기 →" : "다음 →";
}

$("#prev").addEventListener("click", () => {
  if (currentStep > 0) { currentStep--; renderQuestion(); }
});

$("#next").addEventListener("click", () => {
  if (currentStep < QUESTIONS.length - 1) {
    currentStep++;
    renderQuestion();
  } else {
    showResult();
  }
});

/* =========================================================
   5. 매칭 로직
   ========================================================= */
function resolveBodyCategory(){
  if (answers.body !== "unsure") return answers.body;
  if (answers.lifestyle === "hike") return "knee";
  if (answers.lifestyle === "golf") return "wrist";
  return "wrist";
}

function resolveTier(){
  if (answers.priority === "structure" || answers.priority === "relief") return "advanced";
  if (answers.priority === "comfort") return "fit";
  return "active";
}

function getRecommendation(){
  const category = resolveBodyCategory();
  const tier = resolveTier();

  let mainKey, altKeys;

  if (category === "wrist") {
    mainKey = tier === "advanced" ? "wrist_advanced" : tier === "fit" ? "wrist_fit" : "wrist_active";
    altKeys = ["elbow_active", "knee_default"];
  } else if (category === "elbow") {
    mainKey = "elbow_active";
    altKeys = ["wrist_active", "knee_default"];
  } else {
    mainKey = "knee_default";
    altKeys = ["wrist_active", "elbow_active"];
  }

  return { mainKey, altKeys, category, tier };
}

/* =========================================================
   6. 결과 렌더링
   ========================================================= */
function showResult(){
  $("#quiz").style.display = "none";
  const { mainKey, altKeys, category } = getRecommendation();
  const product = PRODUCTS[mainKey];
  const tips = WEARING_TIPS[category] || WEARING_TIPS.wrist;
  const resultEl = $("#result");
  resultEl.classList.add("on");

  resultEl.innerHTML = `
    <div class="analysis">
      <h3>선택하신 답변을 분석했어요</h3>
      <p>· 통증부위 &nbsp;&nbsp;${LABELS[answers.body] || "-"}</p>
      <p>· 활동패턴 &nbsp;&nbsp;${LABELS[answers.lifestyle] || "-"}</p>
      <p>· 착용목적 &nbsp;&nbsp;${LABELS[answers.when] || "-"}</p>
      <p>· 주요고민 &nbsp;&nbsp;${LABELS[answers.priority] || "-"}</p>
    </div>

    <div class="card">
      ${product.img ? `<div class="card-photo"><img src="${product.img}" alt="${product.name}"></div>` : ""}
      <div class="card-top">
        <div class="kicker">전문의 추천 1순위</div>
        <div class="pname">${product.name}</div>
      </div>
      <div class="card-body">
        <div class="summary">${product.desc}</div>

        <div class="sect">
          <h3>이 제품을 추천하는 이유</h3>
          <ul class="why">
            <li>선택하신 통증부위(${LABELS[answers.body] || "-"})에 맞춘 구조 설계</li>
            <li>${LABELS[answers.priority] || "선택하신 고민"}에 초점을 맞춘 라인</li>
            <li>32년차 정형외과 전문의 자문을 거친 특허 구조</li>
          </ul>
        </div>

        <div class="sect">
          <h3>올바른 착용법</h3>
          <ul class="why">
            ${tips.map(t => `<li>${t}</li>`).join("")}
          </ul>
        </div>

        <a class="buy" href="${product.link}" target="_blank" rel="noopener">
          제품 보러가기 <span>↗</span>
        </a>
      </div>
    </div>

    <div class="alts">
      <h3>함께 추천하는 제품</h3>
      ${(category === "wrist" || category === "elbow") ? `<p class="alts-note">손목과 팔꿈치는 하나의 근육 체인으로 연결돼 있어, 운동 전후나 부담이 큰 작업 시 함께 착용하면 통증 예방·재활에 더 효과적이에요.</p>` : ""}
      ${altKeys.map(k => renderAlt(k)).join("")}
    </div>

    <button class="restart" type="button" id="restartBtn">↺ 처음부터 다시 하기</button>

    <p class="disclaim">피코밴드는 많은 분들이 착용 후 긍정적인 개선 효과를 말씀하지만, 착용 효과는 개인차가 있을 수 있습니다.<br>본 진단은 참고용 제품 추천이며, 의학적 진단을 대신하지 않습니다. 통증의 정확한 원인 진단과 치료 방향은 반드시 정형외과 전문의와 상담해 주세요.<br>제품 착용 중 이상 증상이 느껴지면 즉시 착용을 중단하고 문의해 주세요.</p>
  `;

  $("#restartBtn").addEventListener("click", restartQuiz);
}

function renderAlt(key){
  const p = PRODUCTS[key];
  const iconHtml = p.img
    ? `<img src="${p.img}" alt="${p.name}">`
    : (key.startsWith("knee") ? "🦵" : "");
  return `
    <a class="alt" href="${p.link}" target="_blank" rel="noopener">
      <div class="ico">${iconHtml}</div>
      <div>
        <div class="alt-name">${p.name}</div>
        <div class="alt-desc">제품 보러가기</div>
      </div>
      <span class="alt-arrow">→</span>
    </a>
  `;
}

function restartQuiz(){
  currentStep = 0;
  answers = {};
  $("#result").classList.remove("on");
  $("#result").innerHTML = "";
  $("#quiz").style.display = "block";
  renderQuestion();
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* =========================================================
   7. 실행
   ========================================================= */
initialize();
</script>
</body>
</html>
